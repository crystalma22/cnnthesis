name: cnn_env
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.9
  - numpy=1.23
  - pandas
  - matplotlib
  - scikit-learn
  - statsmodels=0.13.5
  - pytorch=1.13.1
  - torchvision=0.14.1
  - pip
  - pip:
      - tqdm
      - yfinance
      - joblib
      - torchsummary
      - pickle5

